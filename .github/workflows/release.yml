name: Build and publish release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: contains(github.event.head_commit.message, '[release]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            script: dist:mac
            artifact: mac
          - os: windows-latest
            script: dist:win
            artifact: windows
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build ${{ matrix.artifact }} packages
        run: npm run ${{ matrix.script }}

      - name: Upload ${{ matrix.artifact }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          overwrite: true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} dist/ \;
          cd dist
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 | sort -z | xargs -0 sha256sum \
            | sed 's#\./VimPDF Setup #./VimPDF.Setup #' > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: VimPDF 1.0.2
          body_path: RELEASE.md
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/checksums.txt
          fail_on_unmatched_files: true
          make_latest: true
